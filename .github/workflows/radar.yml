name: sale-radar
# Cada rodada faz UMA volta nas lojas, publica o estado, e já deixa a próxima rodada agendada.
# O cron de hora em hora é só rede de segurança caso a corrente quebre.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sale-radar
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agendar a próxima rodada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml
      - name: Volta de checagem
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_F: ${{ secrets.TELEGRAM_BOT_TOKEN_F }}
          TELEGRAM_CHAT_ID_F: ${{ secrets.TELEGRAM_CHAT_ID_F }}
        run: |
          git config user.name "sale-radar"
          git config user.email "sale-radar@users.noreply.github.com"
          git fetch -q origin master && git reset -q --hard origin/master
          python sale_radar.py --skip "The Dust Company,Monteleste,Comp Supply" || true
          if ! git diff --quiet state.json; then
            git add state.json
            git commit -qm "estado"
            for i in 1 2 3; do
              git pull --rebase -q -X theirs && git push -q && break
              sleep 3
            done
          fi
      - name: Pausa curta
        run: sleep 45
