name: sale-radar
# Uma rodada longa em laço (checa a cada ~1 min + tempo da coleta) e que se religa sozinha.
# O cron de hora em hora é só rede de segurança caso a corrente quebre.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sale-radar
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Laço de checagem (~5h40)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_F: ${{ secrets.TELEGRAM_BOT_TOKEN_F }}
          TELEGRAM_CHAT_ID_F: ${{ secrets.TELEGRAM_CHAT_ID_F }}
        run: |
          git config user.name "sale-radar"
          git config user.email "sale-radar@users.noreply.github.com"
          END=$((SECONDS + 20400))
          while [ $SECONDS -lt $END ]; do
            python sale_radar.py || true
            if ! git diff --quiet state.json; then
              git add state.json
              git commit -qm "estado"
              git pull --rebase -q -X theirs || true
              git push -q || true
            fi
            sleep 60
          done
      - name: Religar a corrente
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sale-radar.yml
